<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="個人股票追蹤系統 — 跨裝置持股管理" />
  <title>📈 股票追蹤系統</title>

  <!-- Google Fonts: Inter + Noto Sans TC + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Pico CSS (semantic, mobile-first, no build needed) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />

  <!-- App styles -->
  <link rel="stylesheet" href="css/app.css" />

  <!-- Alpine.js (reactive UI, no build) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0c0f" />
</head>
<body>

<!-- ── Top navigation ───────────────────────────────────────────────── -->
<header class="app-header">
  <div class="container-fluid">
    <div class="app-header-inner">
      <span class="app-logo"><span>股票追蹤系統</span></span>
      <div class="header-actions">
        <span id="market-status" class="market-badge"></span>
        <button class="icon-btn" id="settings-btn" onclick="openSettings()" title="設定">⚙</button>
      </div>
    </div>
  </div>
</header>

<!-- ── Tab navigation ───────────────────────────────────────────────── -->
<nav class="tab-nav container-fluid">
  <ul>
    <li><a href="#" class="tab-link active" data-tab="holdings" onclick="switchTab('holdings', this)"><span class="tab-icon">◈</span> 我的持股</a></li>
    <li><a href="#" class="tab-link" data-tab="networth" onclick="switchTab('networth', this)"><span class="tab-icon">◎</span> 總資產</a></li>
    <li><a href="#" class="tab-link" data-tab="performance" onclick="switchTab('performance', this)"><span class="tab-icon">↗</span> 績效圖表</a></li>
    <li><a href="#" class="tab-link" data-tab="ai" onclick="switchTab('ai', this)"><span class="tab-icon">◉</span> AI 分析</a></li>
  </ul>
</nav>

<!-- ── Main content ─────────────────────────────────────────────────── -->
<main class="container-fluid" id="main-content">

  <!-- HOLDINGS TAB -->
  <section id="tab-holdings" class="tab-content active">
    <div id="holdings-root"></div>
  </section>

  <!-- NET WORTH TAB -->
  <section id="tab-networth" class="tab-content">
    <div id="networth-root"></div>
  </section>

  <!-- PERFORMANCE TAB -->
  <section id="tab-performance" class="tab-content">
    <div id="performance-root"></div>
  </section>

  <!-- AI TAB -->
  <section id="tab-ai" class="tab-content">
    <div id="ai-root"></div>
  </section>

</main>

<!-- ── Settings modal ───────────────────────────────────────────────── -->
<dialog id="settings-modal">
  <article>
    <header>
      <button class="close" aria-label="Close" onclick="closeSettings()">✕</button>
      <h3>設定</h3>
    </header>
    <form onsubmit="saveSettings(event)">
      <label>
        GAS Web App URL
        <input type="url" id="cfg-gas-url" placeholder="https://script.google.com/macros/s/.../exec" required />
        <small>部署 Google Apps Script 後取得的 URL</small>
      </label>
      <label>
        Read Token
        <input type="text" id="cfg-read-token" placeholder="從 GAS Config 分頁複製" />
      </label>
      <label>
        Write Token
        <input type="password" id="cfg-write-token" placeholder="私密寫入 token（不存 git）" />
        <small>允許新增、修改、刪除資料</small>
      </label>
      <footer>
        <button type="submit">儲存</button>
        <button type="button" class="secondary" onclick="closeSettings()">取消</button>
      </footer>
    </form>
  </article>
</dialog>

<!-- ── Toast notification ───────────────────────────────────────────── -->
<div id="toast" class="toast" aria-live="polite"></div>

<!-- ── Scripts (ES modules) ─────────────────────────────────────────── -->
<script type="module">
  import { initHoldings } from './js/tabs/holdings.js';
  import { initNetWorth } from './js/tabs/networth.js';
  import { initPerformance } from './js/tabs/performance.js';
  import { initAI } from './js/tabs/ai.js';
  import { loadConfig, saveConfig, getConfig } from './js/config.js';

  // ── Tab switching ──────────────────────────────────────────────────
  window.switchTab = function(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-link').forEach(a => a.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    if (el) el.classList.add('active');

    // Lazy init
    if (tabId === 'holdings' && !window._holdingsInited) {
      initHoldings(document.getElementById('holdings-root'));
      window._holdingsInited = true;
    }
    if (tabId === 'networth' && !window._networthInited) {
      initNetWorth(document.getElementById('networth-root'));
      window._networthInited = true;
    }
    if (tabId === 'performance' && !window._perfInited) {
      initPerformance(document.getElementById('performance-root'));
      window._perfInited = true;
    }
    if (tabId === 'ai' && !window._aiInited) {
      initAI(document.getElementById('ai-root'));
      window._aiInited = true;
    }
  };

  // ── Settings modal ────────────────────────────────────────────────
  window.openSettings = function() {
    const cfg = getConfig();
    document.getElementById('cfg-gas-url').value = cfg.gasUrl || '';
    document.getElementById('cfg-read-token').value = cfg.readToken || '';
    document.getElementById('cfg-write-token').value = cfg.writeToken || '';
    document.getElementById('settings-modal').showModal();
  };

  window.closeSettings = function() {
    document.getElementById('settings-modal').close();
  };

  window.saveSettings = function(e) {
    e.preventDefault();
    saveConfig({
      gasUrl: document.getElementById('cfg-gas-url').value.trim(),
      readToken: document.getElementById('cfg-read-token').value.trim(),
      writeToken: document.getElementById('cfg-write-token').value.trim()
    });
    closeSettings();
    showToast('設定已儲存', 'success');
    // Reinit active tab
    window._holdingsInited = false;
    switchTab('holdings', document.querySelector('[data-tab="holdings"]'));
  };

  // ── Chart.js Global ───────────────────────────────────────────────
  Chart.defaults.font.family = "'Inter', 'Noto Sans TC', system-ui, sans-serif";
  Chart.defaults.color = "#5f6470";

  // ── Toast ────────────────────────────────────────────────────────
  window.showToast = function(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => t.classList.remove('show'), 3000);
  };

  // ── Market status badge ───────────────────────────────────────────
  function updateMarketStatus() {
    const now = new Date();
    // Taiwan timezone offset is UTC+8
    const twTime = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    const h = twTime.getHours(), m = twTime.getMinutes();
    const day = twTime.getDay();
    const el = document.getElementById('market-status');
    if (day === 0 || day === 6) {
      el.textContent = '休市'; el.className = 'market-badge closed';
    } else if ((h === 9 && m >= 0) || (h > 9 && h < 13) || (h === 13 && m <= 30)) {
      el.textContent = '交易中'; el.className = 'market-badge open';
    } else {
      el.textContent = '收盤'; el.className = 'market-badge closed';
    }
  }

  // ── Init ──────────────────────────────────────────────────────────
  function boot() {
    // Load config
    loadConfig();

    // Market status
    updateMarketStatus();
    setInterval(updateMarketStatus, 60000);

    // Init default tab
    initHoldings(document.getElementById('holdings-root'));
    window._holdingsInited = true;

    // Prompt settings if not configured
    const cfg = getConfig();
    if (!cfg.gasUrl) {
      showToast('請先在 設定 中填入 GAS URL', 'warn');
    }
  }

  boot();
</script>

</body>
</html>
